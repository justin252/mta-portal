name: test
on: [push, pull_request]
jobs:
  desktop:
    # Board-free layers of the verification loop; the board steps run locally (make verify/inject/soak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
